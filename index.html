<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="บัญชีร้านอาหาร">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>บัญชีร้านอาหารตามสั่ง</title>
<style>
:root{
  --green:#1b7a2f; --green-d:#14591f; --green-bg:#e4f4e6;
  --red:#c62828; --red-bg:#fde8e8;
  --blue:#0d5fa8; --ink:#1a1a1a; --mute:#555; --line:#cfd6cf; --bg:#f6f4ec; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  line-height:1.4;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;touch-action:manipulation}
.page{max-width:560px;margin:0 auto;padding:12px 14px}
h2{font-size:1.5rem;margin:.2rem 0 .6rem}
h3{font-size:1.2rem;margin:1.2rem 0 .3rem}
label{display:block;font-weight:700;margin:.6rem 0 .2rem}
.hint{color:var(--mute);font-size:.9rem;margin:.1rem 0 .6rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.card .lbl{font-size:1.05rem;color:var(--mute);font-weight:700}
.card .big{font-size:2.4rem;font-weight:800;line-height:1.15}
.card.good{background:var(--green-bg);border-color:var(--green)}
.card.bad{background:var(--red-bg);border-color:var(--red)}
.good .big,.pos{color:var(--green-d)}
.bad .big,.neg{color:var(--red)}
.hero .big{font-size:3.2rem}

.btn{min-height:64px;border-radius:16px;font-weight:800;font-size:1.2rem;padding:10px 16px;width:100%}
.btn.big{min-height:72px;font-size:1.35rem}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.gray{background:#e3e3e3}
.btn.ghost{background:#fff;border:3px dashed var(--green);color:var(--green-d);margin:8px 0}
.btn.small{min-height:52px;font-size:1rem;width:auto}
.btn:active{filter:brightness(.88);transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.datebar{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;margin:4px 0 8px}
.datebar .btn{min-height:60px;padding:0;font-size:1.6rem}
.datebar .d{text-align:center;font-weight:800;font-size:1.15rem}
.datebar .d small{display:block;font-weight:600;color:var(--mute);font-size:.85rem}

.strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.strip div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center}
.strip small{display:block;font-size:.8rem;color:var(--mute);font-weight:700}
.strip b{font-size:1.15rem}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.seg button{min-height:64px;border-radius:16px;font-size:1.3rem;font-weight:800;background:#e9e9e9;border:3px solid transparent}
.seg button.on.in{background:var(--green);color:#fff}
.seg button.on.out{background:var(--red);color:#fff}
.seg button.on.neutral{background:var(--blue);color:#fff}

.display{background:#fff;border:3px solid var(--ink);border-radius:18px;text-align:right;padding:8px 16px;margin:8px 0;
  font-size:3rem;font-weight:800;min-height:78px;overflow:hidden}
.display small{font-size:1.2rem;color:var(--mute);font-weight:700;margin-right:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:68px;font-size:2rem;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:16px}
.keys button:active{background:#d9d9d9}
.keys .del{background:#ffe9b3}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{min-height:52px;padding:6px 14px;border-radius:30px;background:#fff;border:2px solid var(--line);font-size:1.05rem;font-weight:700}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.menus{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.menus button{min-height:70px;border-radius:16px;background:#fff;border:3px solid var(--green);font-weight:800;font-size:1.05rem;padding:6px}
.menus button span{display:block;color:var(--green-d);font-size:1.2rem}

.list .it{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;border:2px solid var(--line);padding:8px 10px;margin:6px 0}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis}
.it .t small{color:var(--mute)}
.it .a{font-weight:800;font-size:1.3rem;white-space:nowrap}
.it .x{min-height:48px;padding:0 12px;border-radius:12px;background:#eee;font-weight:700}
.empty{text-align:center;color:var(--mute);padding:18px 0}

.inp{width:100%;min-height:60px;font-size:1.4rem;padding:8px 12px;border:3px solid #8a8a8a;border-radius:14px;background:#fff}
.inp:focus{outline:none;border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ing{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin:10px 0}
.ing-top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ing-top .x{min-height:60px;padding:0 14px;border-radius:14px;background:#ffd9d9;font-weight:800;color:var(--red)}
.ing-cost{text-align:right;font-weight:800;color:var(--blue);margin-top:6px;font-size:1.1rem}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.pills button{min-height:78px;border-radius:16px;background:#fff;border:3px solid var(--line);font-weight:800;font-size:1.3rem}
.pills button small{display:block;font-size:1rem;color:var(--mute)}
.pills button.on{background:var(--green);border-color:var(--green);color:#fff}
.pills button.on small{color:#fff}
.mcard{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;margin:8px 0;display:block}
.mcard b{font-size:1.3rem;display:block}
.mcard span{display:block;color:var(--mute);font-size:1rem}
.mcard em{font-style:normal;font-weight:800;color:var(--green-d)}

.bars .b{display:grid;grid-template-columns:54px 1fr 92px;gap:6px;align-items:center;margin:5px 0;font-size:1rem}
.bars .tr{height:24px;background:#e8e8e8;border-radius:12px;overflow:hidden}
.bars .fl{height:100%;border-radius:12px}
.bars .v{text-align:right;font-weight:800}

nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--green);display:grid;grid-template-columns:repeat(3,1fr);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;min-height:76px;font-size:1.05rem;font-weight:800;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button i{font-style:normal;font-size:1.8rem;line-height:1}
nav button.on{background:var(--green);color:#fff}

.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:560px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;
  padding:14px 22px;border-radius:30px;font-size:1.15rem;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.btn.blue{background:var(--blue);color:#fff}
.stack .btn{margin:8px 0}
.file{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
</style>
</head>
<body>
<main id="app" class="page"></main>
<div id="sheet" hidden></div>
<nav>
  <button data-act="tab" data-v="sell"><i>📒</i>จดบัญชี</button>
  <button data-act="tab" data-v="cost"><i>🍳</i>คิดต้นทุน</button>
  <button data-act="tab" data-v="sum"><i>📊</i>สรุป</button>
</nav>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ---------- ข้อมูล (เก็บในเครื่อง) ---------- */
var KEY='rrs_v1';
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.entries)&&Array.isArray(d.menus))return d;}catch(e){}
  return{entries:[],menus:[]};
}
var db=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){toast('เก็บข้อมูลไม่ได้ กรุณาสำรองข้อมูล');}
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

/* ---------- ตัวช่วย ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function addMonths(s,n){var d=parse(s);d.setDate(1);d.setMonth(d.getMonth()+n);return ymd(d);}
function thDate(s){return parse(s).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function thMonth(s){return parse(s).toLocaleDateString('th-TH',{month:'long',year:'numeric'});}
function fmt(n){return Number(Math.round(n*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});}
function num(v){return parseFloat(String(v==null?'':v).replace(/,/g,''))||0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function $(id){return document.getElementById(id);}
var tt;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},2200);}
function totals(prefix){
  var r={inc:0,out:0};
  db.entries.forEach(function(e){if(e.date.indexOf(prefix)===0){if(e.type==='in')r.inc+=e.amount;else r.out+=e.amount;}});
  return r;
}
function money(n,cls){return '<span class="'+(cls||'')+'">฿'+fmt(n)+'</span>';}

/* ---------- สถานะหน้าจอ ---------- */
var today=ymd(new Date());
var ui={tab:'sell',date:today,type:'in',amt:'',cat:'',sumMode:'day',sumDate:today,draft:null};
var CATS=['วัตถุดิบ','ค่าแก๊ส/น้ำ/ไฟ','ค่าจ้าง','อื่นๆ'];

/* ---------- หน้า: จดบัญชี ---------- */
function sellHtml(){
  var t=totals(ui.date), net=t.inc-t.out, isIn=ui.type==='in';
  var h='';
  h+='<div class="datebar"><button class="btn gray" data-act="day" data-v="-1" aria-label="วันก่อนหน้า">◀</button>'+
     '<div class="d">'+thDate(ui.date)+(ui.date===today?'<small>วันนี้</small>':'<small><a href="#" data-act="goToday" style="color:var(--blue)">กลับไปวันนี้</a></small>')+'</div>'+
     '<button class="btn gray" data-act="day" data-v="1" aria-label="วันถัดไป">▶</button></div>';
  h+='<div class="strip"><div><small>ขายได้</small><b class="pos">฿'+fmt(t.inc)+'</b></div>'+
     '<div><small>จ่ายออก</small><b class="neg">฿'+fmt(t.out)+'</b></div>'+
     '<div><small>เหลือ</small><b class="'+(net>=0?'pos':'neg')+'">฿'+fmt(net)+'</b></div></div>';
  h+='<div class="seg"><button class="in'+(isIn?' on':'')+'" data-act="type" data-v="in">💰 ขายได้</button>'+
     '<button class="out'+(!isIn?' on':'')+'" data-act="type" data-v="out">🛒 จ่ายออก</button></div>';
  if(isIn){
    if(db.menus.length)h+='<div class="hint">กดชื่อเมนูที่ขาย แล้วเลือก ธรรมดา / พิเศษ / กับข้าว</div><div class="menus">'+
      db.menus.map(function(m){return '<button data-act="pick" data-v="'+m.id+'">'+esc(m.name)+'<span>฿'+fmt(m.price)+(m.ps>0?' / ฿'+fmt(m.ps):'')+'</span></button>';}).join('')+'</div>';
    h+='<button class="btn ghost" data-act="manage">✏ เพิ่ม / แก้ไขเมนูอาหาร</button>';
  }
  if(!isIn){
    h+='<div class="chips">'+CATS.map(function(c){return '<button class="chip'+(ui.cat===c?' on':'')+'" data-act="cat" data-v="'+c+'">'+c+'</button>';}).join('')+'</div>';
  }
  h+='<div class="display"><small>฿</small>'+(ui.amt?Number(ui.amt).toLocaleString('th-TH'):'0')+'</div>';
  h+='<div class="keys">'+['1','2','3','4','5','6','7','8','9','00','0'].map(function(k){return '<button data-act="key" data-v="'+k+'">'+k+'</button>';}).join('')+
     '<button class="del" data-act="back" aria-label="ลบตัวเลข">⌫</button></div>';
  h+='<div style="margin:10px 0"><button class="btn big '+(isIn?'green':'red')+'" data-act="add">'+(isIn?'✔ บันทึก ขายได้':'✔ บันทึก จ่ายออก')+'</button></div>';

  var rows=db.entries.filter(function(e){return e.date===ui.date;}).sort(function(a,b){return b.ts-a.ts;});
  var groups=[],map={};
  rows.forEach(function(e){
    if(e.note){
      var k=e.type+'|'+e.note+'|'+e.amount;
      if(map[k]){map[k].n++;map[k].sum+=e.amount;return;}
      map[k]={e:e,n:1,sum:e.amount};groups.push(map[k]);
    }else groups.push({e:e,n:1,sum:e.amount});
  });
  h+='<h3>รายการ'+(ui.date===today?'วันนี้':'ของวันนี้')+'</h3><div class="list">';
  if(!groups.length)h+='<div class="empty">ยังไม่มีรายการ</div>';
  groups.forEach(function(g){
    var e=g.e,inc=e.type==='in';
    h+='<div class="it"><div class="t"><b>'+(inc?'💰 ':'🛒 ')+(esc(e.note)||(inc?'ขายได้':'จ่ายออก'))+(g.n>1?' ×'+g.n:'')+'</b>'+
       '<small>'+new Date(e.ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.</small></div>'+
       '<div class="a '+(inc?'pos':'neg')+'">'+(inc?'+':'−')+fmt(g.sum)+'</div>'+
       '<button class="x" data-act="delEntry" data-v="'+e.id+'">ลบ</button></div>';
  });
  return h+'</div>';
}

/* ---------- หน้า: คิดต้นทุน ---------- */
function ingCost(g){var b=num(g.b);return b>0?num(g.p)/b*num(g.q):0;}
function draftCost(d){return d.ing.reduce(function(s,g){return s+ingCost(g);},0);}
function suggest(cost,m){
  if(cost<=0)return 0;
  var p=cost/(1-m/100),step=cost>=20?5:1;
  return Math.ceil(p/step-1e-9)*step;
}
function costHtml(){
  var h='<h2>คิดต้นทุนต่อจาน</h2><p class="hint">ใส่ราคาวัตถุดิบ แล้วโปรแกรมจะบอกราคาขายที่ควรตั้ง</p>';
  if(!db.menus.length)h+='<div class="empty">ยังไม่มีเมนู กดปุ่มด้านล่างเพื่อเพิ่ม</div>';
  db.menus.forEach(function(m){
    var pr=m.price-m.cost;
    h+='<button class="mcard" data-act="editMenu" data-v="'+m.id+'"><b>'+esc(m.name)+'</b>'+
       '<span>ต้นทุน ฿'+fmt(m.cost)+' · ขาย <em>฿'+fmt(m.price)+'</em></span>'+
       '<span>กำไรจานละ <em>฿'+fmt(pr)+'</em> ('+(m.price>0?Math.round(pr/m.price*100):0)+'%)</span></button>';
  });
  return h+'<button class="btn big green" data-act="newMenu" style="margin-top:10px">＋ เพิ่มเมนูใหม่</button>';
}
function ingRow(g,i){
  return '<div class="ing" data-i="'+i+'">'+
   '<div class="ing-top"><input class="inp" data-k="n" placeholder="ชื่อวัตถุดิบ เช่น หมูสับ" value="'+esc(g.n)+'"><button class="x" data-act="delIng" data-v="'+i+'">ลบ</button></div>'+
   '<div class="grid2">'+
   '<div><label>ราคาที่ซื้อ (บาท)</label><input class="inp" inputmode="decimal" data-k="p" placeholder="120" value="'+esc(g.p)+'"></div>'+
   '<div><label>หน่วย</label><input class="inp" data-k="u" placeholder="กรัม" value="'+esc(g.u)+'"></div>'+
   '<div><label>ซื้อมาได้</label><input class="inp" inputmode="decimal" data-k="b" placeholder="1000" value="'+esc(g.b)+'"></div>'+
   '<div><label>ใช้ต่อ 1 จาน</label><input class="inp" inputmode="decimal" data-k="q" placeholder="80" value="'+esc(g.q)+'"></div>'+
   '</div><div class="ing-cost" id="ic'+i+'"></div></div>';
}
function wrapSheet(inner){return '<div class="sheet"><div class="sheet-in">'+inner+'</div></div>';}
function findMenu(id){return db.menus.filter(function(x){return x.id===id;})[0];}
function pickSheet(){
  var m=findMenu(ui.pickId);if(!m)return '';
  return wrapSheet('<h2>'+esc(m.name)+'</h2><p class="hint">ลูกค้าสั่งแบบไหน?</p><div class="stack">'+
    '<button class="btn big green" data-act="sellAs" data-v="n">ธรรมดา ฿'+fmt(m.price)+'</button>'+
    (m.ps>0?'<button class="btn big blue" data-act="sellAs" data-v="s">พิเศษ ฿'+fmt(m.ps)+'</button>':'')+
    '</div><h3>กับข้าว / ราคาอื่น</h3><label>ใส่ราคาเอง (บาท)</label>'+
    '<input id="customInp" class="inp" inputmode="decimal" placeholder="เช่น 80">'+
    '<div class="stack"><button class="btn big red" data-act="sellAs" data-v="c">✔ บันทึกราคานี้</button>'+
    '<button class="btn big gray" data-act="closeSheet">ยกเลิก</button></div>');
}
function manageSheet(){
  var h='<h2>เมนูอาหาร</h2><p class="hint">กด "แก้ไข" เพื่อเปลี่ยนชื่อหรือราคา</p>';
  if(!db.menus.length)h+='<div class="empty">ยังไม่มีเมนู</div>';
  db.menus.forEach(function(m){
    h+='<div class="it" style="margin:8px 0"><div class="t"><b>'+esc(m.name)+'</b><small>ธรรมดา ฿'+fmt(m.price)+(m.ps>0?' · พิเศษ ฿'+fmt(m.ps):'')+'</small></div>'+
       '<button class="x" data-act="qEdit" data-v="'+m.id+'">แก้ไข</button></div>';
  });
  return wrapSheet(h+'<div class="stack"><button class="btn big green" data-act="qNew">＋ เพิ่มเมนูใหม่</button><button class="btn big gray" data-act="closeSheet">ปิด</button></div>');
}
function quickSheet(){
  var q=ui.q;
  return wrapSheet('<h2>'+(q.id?'แก้ไขเมนู':'เมนูใหม่')+'</h2>'+
    '<label>ชื่อเมนู</label><input class="inp" data-q="name" placeholder="เช่น ผัดกะเพราหมูสับ" value="'+esc(q.name)+'">'+
    '<label>ราคาธรรมดา (บาท)</label><input class="inp" inputmode="decimal" data-q="pn" value="'+esc(q.pn)+'">'+
    '<label>ราคาพิเศษ (บาท) ไม่มีให้เว้นว่าง</label><input class="inp" inputmode="decimal" data-q="ps" value="'+esc(q.ps)+'">'+
    '<div class="row2"><button class="btn big gray" data-act="qCancel">ยกเลิก</button><button class="btn big green" data-act="qSave">✔ บันทึก</button></div>'+
    (q.id?'<button class="btn gray" data-act="qDel" style="color:var(--red)">ลบเมนูนี้</button>':''));
}
function sheetHtml(){
  if(ui.sheet==='pick')return pickSheet();
  if(ui.sheet==='manage')return manageSheet();
  if(ui.sheet==='quick')return quickSheet();
  var d=ui.draft;if(!d)return '';
  return '<div class="sheet"><div class="sheet-in">'+
   '<h2>'+(d.id?'แก้ไขเมนู':'เมนูใหม่')+'</h2>'+
   '<label>ชื่อเมนู</label><input class="inp" data-f="name" placeholder="เช่น ผัดกะเพราหมูสับ" value="'+esc(d.name)+'">'+
   '<h3>วัตถุดิบ</h3><p class="hint">ตัวอย่าง: หมูสับ ซื้อ 120 บาท ได้ 1000 กรัม ใช้จานละ 80 กรัม</p>'+
   d.ing.map(ingRow).join('')+
   '<button class="btn big ghost" data-act="addIng">＋ เพิ่มวัตถุดิบ</button>'+
   '<div id="calc"></div>'+
   '<label>ราคาธรรมดา ที่จะขายจริง (บาท)</label><input id="priceInp" class="inp" inputmode="decimal" value="">'+
   '<label>ราคาพิเศษ (บาท) ไม่มีให้เว้นว่าง</label><input id="psInp" class="inp" inputmode="decimal" value="'+esc(d.ps)+'">'+
   '<div id="profitLine" class="card"></div>'+
   '<div class="row2"><button class="btn big gray" data-act="closeSheet">ยกเลิก</button><button class="btn big green" data-act="saveMenu">✔ บันทึกเมนู</button></div>'+
   (d.id?'<button class="btn gray" data-act="delMenu" style="color:var(--red);margin-top:6px">ลบเมนูนี้</button>':'')+
   '</div></div>';
}
function openSheet(kind){
  if(kind)ui.sheet=kind;
  var s=$('sheet');s.hidden=false;s.innerHTML=sheetHtml();document.body.style.overflow='hidden';
  if(ui.sheet==='cost'&&ui.draft){updateCalc();if(ui.draft.manual)$('priceInp').value=ui.draft.price;}
}
function closeSheet(){ui.draft=null;ui.q=null;ui.sheet='';var s=$('sheet');s.hidden=true;s.innerHTML='';document.body.style.overflow='';}
function effPrice(d,cost){return d.manual?num(d.price):suggest(cost,d.margin);}
function updateCalc(){
  var d=ui.draft;if(!d)return;
  var cost=draftCost(d);
  d.ing.forEach(function(g,i){var el=$('ic'+i);if(el)el.textContent=ingCost(g)>0?'= ฿'+fmt(ingCost(g))+' ต่อจาน':'';});
  var sug=suggest(cost,d.margin);
  var h='<div class="card"><div class="lbl">ต้นทุนรวมต่อจาน</div><div class="big">฿'+fmt(cost)+'</div></div>'+
    '<h3>อยากได้กำไรเท่าไร?</h3><p class="hint">% ของราคาขาย เช่น 40% = ขาย 100 บาท ได้กำไร 40 บาท</p><div class="pills">'+
    [30,40,50].map(function(m){return '<button class="'+(d.margin===m?'on':'')+'" data-act="margin" data-v="'+m+'">'+m+'%<small>'+(cost>0?'ขาย ฿'+fmt(suggest(cost,m)):'')+'</small></button>';}).join('')+
    '</div><div class="card good"><div class="lbl">ราคาขายที่แนะนำ</div><div class="big">฿'+fmt(sug)+'</div></div>';
  $('calc').innerHTML=h;
  var pi=$('priceInp');
  if(!d.manual)pi.value=sug?String(sug):'';
  var p=effPrice(d,cost),pr=p-cost,pc=p>0?Math.round(pr/p*100):0;
  var pl=$('profitLine');
  pl.className='card '+(pr>=0?'good':'bad');
  pl.innerHTML='<div class="lbl">กำไรต่อจาน</div><div class="big">฿'+fmt(pr)+'</div><div class="lbl">คิดเป็น '+pc+'% ของราคาขาย</div>';
}

/* ---------- หน้า: สรุป ---------- */
function sumHtml(){
  var month=ui.sumMode==='month',d=ui.sumDate;
  var prefix=month?d.slice(0,7):d,t=totals(prefix),net=t.inc-t.out;
  var h='<div class="seg"><button class="neutral'+(!month?' on':'')+'" data-act="mode" data-v="day">รายวัน</button>'+
        '<button class="neutral'+(month?' on':'')+'" data-act="mode" data-v="month">รายเดือน</button></div>';
  h+='<div class="datebar"><button class="btn gray" data-act="sdate" data-v="-1">◀</button><div class="d">'+(month?thMonth(d):thDate(d))+'</div><button class="btn gray" data-act="sdate" data-v="1">▶</button></div>';
  h+='<div class="card hero '+(net>=0?'good':'bad')+'"><div class="lbl">กำไรสุทธิ'+(net<0?' (ขาดทุน)':'')+'</div><div class="big">฿'+fmt(net)+'</div></div>';
  h+='<div class="row2"><div class="card good" style="margin:0"><div class="lbl">ยอดขาย</div><div class="big" style="font-size:1.9rem">฿'+fmt(t.inc)+'</div></div>'+
     '<div class="card bad" style="margin:0"><div class="lbl">ต้นทุน/รายจ่าย</div><div class="big" style="font-size:1.9rem">฿'+fmt(t.out)+'</div></div></div>';
  if(month){
    var days={};
    db.entries.forEach(function(e){if(e.date.indexOf(prefix)===0){var o=days[e.date]||(days[e.date]=0);days[e.date]=o+(e.type==='in'?e.amount:-e.amount);}});
    var keys=Object.keys(days).sort(),mx=Math.max.apply(null,keys.map(function(k){return Math.abs(days[k]);}).concat([1]));
    h+='<h3>กำไรแต่ละวัน</h3>';
    if(!keys.length)h+='<div class="empty">เดือนนี้ยังไม่มีรายการ</div>';
    else{
      h+='<div class="bars">'+keys.map(function(k){var v=days[k];
        return '<div class="b"><div>'+parseInt(k.slice(8),10)+'</div><div class="tr"><div class="fl" style="width:'+Math.max(4,Math.abs(v)/mx*100)+'%;background:'+(v>=0?'var(--green)':'var(--red)')+'"></div></div><div class="v '+(v>=0?'pos':'neg')+'">'+fmt(v)+'</div></div>';}).join('')+'</div>';
      var best=keys.reduce(function(a,b){return days[b]>days[a]?b:a;},keys[0]);
      h+='<div class="card"><div class="lbl">วันที่ขายดีที่สุด</div><b style="font-size:1.3rem">'+thDate(best)+'</b><br>กำไร <b class="pos">฿'+fmt(days[best])+'</b></div>';
    }
  }
  h+='<h3>สำรองข้อมูล</h3><p class="hint">ข้อมูลเก็บในมือถือเครื่องนี้ ควรกดสำรองไว้บ้าง เผื่อเปลี่ยนเครื่อง</p>'+
     '<div class="row2"><button class="btn gray" data-act="export">💾 บันทึกไฟล์</button>'+
     '<label class="btn gray file" style="margin:0">📂 เปิดไฟล์<input type="file" accept=".json,application/json" id="imp"></label></div>';
  return h;
}

/* ---------- แสดงผล ---------- */
function render(){
  var app=$('app');
  app.innerHTML=ui.tab==='sell'?sellHtml():ui.tab==='cost'?costHtml():sumHtml();
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){b.classList.toggle('on',b.dataset.v===ui.tab);});
  var imp=$('imp');if(imp)imp.addEventListener('change',importFile);
}

/* ---------- การกระทำ ---------- */
function addEntry(type,amount,note){
  db.entries.push({id:uid(),date:ui.date,type:type,amount:amount,note:note||'',ts:Date.now()});
  save();
}
var A={
  tab:function(v){ui.tab=v;window.scrollTo(0,0);render();},
  day:function(v){ui.date=addDays(ui.date,+v);render();},
  goToday:function(){ui.date=today;render();},
  type:function(v){ui.type=v;ui.cat='';render();},
  cat:function(v){ui.cat=ui.cat===v?'':v;render();},
  key:function(v){if((ui.amt+v).length>7)return;ui.amt=(ui.amt+v).replace(/^0+/,'');render();},
  back:function(){ui.amt=ui.amt.slice(0,-1);render();},
  add:function(){
    var a=num(ui.amt);
    if(a<=0){toast('กรุณากดตัวเลขจำนวนเงินก่อน');return;}
    addEntry(ui.type,a,ui.type==='out'?ui.cat:'');
    toast('บันทึกแล้ว ✔ '+(ui.type==='in'?'ขายได้ ':'จ่ายออก ')+fmt(a)+' บาท');
    ui.amt='';ui.cat='';render();
  },
  pick:function(v){ui.pickId=v;openSheet('pick');},
  sellAs:function(v){
    var m=findMenu(ui.pickId);if(!m)return;
    var a,tag;
    if(v==='n'){a=m.price;tag='ธรรมดา';}
    else if(v==='s'){a=m.ps;tag='พิเศษ';}
    else{a=num($('customInp').value);tag='กับข้าว';if(a<=0){toast('กรุณาใส่ราคา');return;}}
    addEntry('in',a,m.name+' ('+tag+')');
    closeSheet();toast('ขาย '+m.name+' ('+tag+') '+fmt(a)+' บาท ✔');render();
  },
  manage:function(){openSheet('manage');},
  qNew:function(){ui.q={id:null,name:'',pn:'50',ps:'60'};openSheet('quick');},
  qEdit:function(v){var m=findMenu(v);if(!m)return;ui.q={id:m.id,name:m.name,pn:String(m.price),ps:m.ps>0?String(m.ps):''};openSheet('quick');},
  qCancel:function(){ui.q=null;openSheet('manage');},
  qSave:function(){
    var q=ui.q,pn=num(q.pn),ps=num(q.ps);
    if(!q.name.trim()){toast('กรุณาใส่ชื่อเมนู');return;}
    if(pn<=0){toast('กรุณาใส่ราคาธรรมดา');return;}
    var m=q.id?findMenu(q.id):null;
    if(m){m.name=q.name.trim();m.price=pn;m.ps=ps;}
    else db.menus.push({id:uid(),name:q.name.trim(),margin:40,price:pn,ps:ps,cost:0,ing:[]});
    save();ui.q=null;toast('บันทึกเมนูแล้ว ✔');openSheet('manage');render();
  },
  qDel:function(){
    if(!confirm('ลบเมนู "'+ui.q.name+'" ใช่ไหม?'))return;
    var id=ui.q.id;db.menus=db.menus.filter(function(x){return x.id!==id;});save();ui.q=null;openSheet('manage');render();
  },
  delEntry:function(v){
    var e=db.entries.filter(function(x){return x.id===v;})[0];if(!e)return;
    if(!confirm('ลบรายการนี้ ('+fmt(e.amount)+' บาท) ใช่ไหม?'))return;
    db.entries=db.entries.filter(function(x){return x.id!==v;});save();render();
  },
  newMenu:function(){ui.draft={id:null,name:'',margin:40,manual:true,price:'50',ps:'60',ing:[{n:'',p:'',u:'',b:'',q:''}]};openSheet('cost');},
  editMenu:function(v){
    var m=findMenu(v);if(!m)return;
    ui.draft={id:m.id,name:m.name,margin:m.margin,manual:true,price:String(m.price),ps:m.ps>0?String(m.ps):'',ing:JSON.parse(JSON.stringify(m.ing))};
    openSheet('cost');
  },
  addIng:function(){ui.draft.ing.push({n:'',p:'',u:'',b:'',q:''});var y=$('sheet').firstChild.scrollTop;openSheet();$('sheet').firstChild.scrollTop=y;},
  delIng:function(v){ui.draft.ing.splice(+v,1);if(!ui.draft.ing.length)ui.draft.ing.push({n:'',p:'',u:'',b:'',q:''});var y=$('sheet').firstChild.scrollTop;openSheet();$('sheet').firstChild.scrollTop=y;},
  margin:function(v){ui.draft.margin=+v;ui.draft.manual=false;updateCalc();},
  closeSheet:function(){closeSheet();},
  saveMenu:function(){
    var d=ui.draft;
    if(!d.name.trim()){toast('กรุณาใส่ชื่อเมนู');return;}
    var ing=d.ing.filter(function(g){return g.n.trim()||num(g.p)>0;});
    var cost=draftCost({ing:ing}),price=effPrice(d,draftCost(d));
    if(price<=0){toast('กรุณาใส่ราคาวัตถุดิบหรือราคาขาย');return;}
    var m={id:d.id||uid(),name:d.name.trim(),margin:d.margin,price:price,ps:num(d.ps),cost:cost,ing:ing};
    var i=db.menus.findIndex(function(x){return x.id===m.id;});
    if(i>=0)db.menus[i]=m;else db.menus.push(m);
    save();closeSheet();toast('บันทึกเมนูแล้ว ✔');render();
  },
  delMenu:function(){
    if(!confirm('ลบเมนู "'+ui.draft.name+'" ใช่ไหม?'))return;
    var id=ui.draft.id;db.menus=db.menus.filter(function(x){return x.id!==id;});save();closeSheet();render();
  },
  mode:function(v){ui.sumMode=v;render();},
  sdate:function(v){ui.sumDate=ui.sumMode==='month'?addMonths(ui.sumDate,+v):addDays(ui.sumDate,+v);render();},
  export:function(){
    var blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='บัญชีร้าน-'+ymd(new Date())+'.json';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    toast('บันทึกไฟล์สำรองแล้ว');
  }
};
function importFile(ev){
  var f=ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.entries)||!Array.isArray(d.menus))throw 0;
      if(!confirm('นำข้อมูลจากไฟล์มาแทนที่ข้อมูลในเครื่องนี้ ใช่ไหม?'))return;
      db=d;save();toast('นำข้อมูลเข้าแล้ว ✔');render();
    }catch(e){toast('ไฟล์นี้ใช้ไม่ได้');}
  };
  r.readAsText(f);
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var f=A[el.dataset.act];if(!f)return;
  ev.preventDefault();f(el.dataset.v);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset.q&&ui.q){ui.q[t.dataset.q]=t.value;return;}
  var d=ui.draft;if(!d)return;
  if(t.dataset.f==='name'){d.name=t.value;return;}
  if(t.id==='psInp'){d.ps=t.value;return;}
  if(t.id==='priceInp'){d.manual=true;d.price=t.value;updateCalc();return;}
  if(t.dataset.k){
    var row=t.closest('.ing');d.ing[+row.dataset.i][t.dataset.k]=t.value;
    if(t.dataset.k==='u')return;
    updateCalc();
  }
});

/* ---------- ออฟไลน์ ---------- */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
render();
})();
</script>
</body>
</html>
